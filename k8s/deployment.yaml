apiVersion: apps/v2
kind: Deployment

metadata:
  name: myapp-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
      app: myapp

  template:
    metadata:
      labels:
        app: myapp

    spec:
      containers:
      - name: myapp

        image: paraggautam1/myapp:v2

        ports:
        - containerPort: 80
